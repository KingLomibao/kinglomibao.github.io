[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]  # auto-generated migration scripts

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "B008",  # `Depends(...)` as a default argument is the standard FastAPI dependency-injection pattern.
]

[tool.ruff.lint.per-file-ignores]
# One row per reference-data entry is more readable than wrapping these onto several lines each.
"app/seed/reference_data.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
